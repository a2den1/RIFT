    <button data-rank="bounty"><i class="fa-solid fa-sack-dollar"></i> 현상금</button>
    <button data-rank="club"><i class="fa-solid fa-shield-halved"></i> 구단</button>
  </div>

      <table class="tbl">
        <thead><tr id="rankHead"></tr></thead>
        <tbody id="rankBody"></tbody>
      </table>
